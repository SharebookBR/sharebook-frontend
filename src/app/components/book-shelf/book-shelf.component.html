<section class="book-shelf" [ngClass]="'book-shelf--' + appearance">
  <div class="book-shelf__header">
    <div>
      <h2 class="book-shelf__title">{{ title }}</h2>
      <p class="book-shelf__description" *ngIf="description">{{ description }}</p>
    </div>

    <a *ngIf="moreLink" [routerLink]="moreLink" class="book-shelf__more">
      {{ moreLabel }}
      <span aria-hidden="true">›</span>
      <span class="book-shelf__badge" *ngIf="badgeText">{{ badgeText }}</span>
    </a>
  </div>

  <div class="book-shelf__wrapper">
    <button
      type="button"
      class="book-shelf__arrow book-shelf__arrow--left"
      [class.book-shelf__arrow--disabled]="leftDisabled"
      [disabled]="leftDisabled"
      (click)="scroll('left')"
      aria-label="Livros anteriores"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <div #track class="book-shelf__track" role="list" (scroll)="updateArrows()" [attr.aria-label]="ariaLabel">
      <div
        class="book-shelf__item"
        role="listitem"
        *ngFor="let book of books; let index = index; trackBy: trackBook"
        (click)="selectBook(book, index)"
      >
        <app-book-card [book]="book" layout="shelf"></app-book-card>
      </div>
    </div>

    <button
      type="button"
      class="book-shelf__arrow book-shelf__arrow--right"
      [class.book-shelf__arrow--disabled]="rightDisabled"
      [disabled]="rightDisabled"
      (click)="scroll('right')"
      aria-label="Próximos livros"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>
</section>
