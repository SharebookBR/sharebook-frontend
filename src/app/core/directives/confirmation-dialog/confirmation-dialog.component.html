<button mat-icon-button type="button" class="sharebook-dialog-close" aria-label="Fechar" mat-dialog-close>
  <i class="fa fa-times" aria-hidden="true"></i>
</button>
<h4 mat-dialog-title>{{ data.title }}</h4>
<mat-dialog-content>
  {{ data.message }}
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button [mat-dialog-close]="true" color="primary" type="submit">{{ data.btnOkText }}</button>
  @if (data.btnCancelText !== '') {
    <button mat-stroked-button [mat-dialog-close]="false">{{ data.btnCancelText }}</button>
  }
</mat-dialog-actions>
