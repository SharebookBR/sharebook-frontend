<h2 mat-dialog-title class="crop-dialog-title">
  <span>Recortar capa</span>
  <button mat-icon-button type="button" (click)="cancel()" aria-label="Fechar recorte">
    <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content class="crop-dialog-content">
  @if (loadFailed) {
    <div class="load-failed">
      <mat-icon>broken_image</mat-icon>
      <p>Não foi possível carregar a imagem para recorte.</p>
      <p>Use <strong>Trocar imagem</strong> para fazer upload de uma nova imagem.</p>
    </div>
  }

  @if (!loadFailed) {
    <p class="crop-hint" id="crop-hint">
      <mat-icon>south</mat-icon>
      Arraste a borda inferior da moldura para cima e remova a parte de baixo da foto.
    </p>

    <div class="cropper-stage">
      <image-cropper
        [imageURL]="data.imageUrl"
        [imageBase64]="data.imageBase64"
        imageAltText="Prévia da capa para recorte"
        [maintainAspectRatio]="false"
        [transform]="transform"
        [initialStepSize]="12"
        format="jpeg"
        aria-describedby="crop-hint"
        (imageCropped)="onImageCropped($event)"
        (loadImageFailed)="onLoadImageFailed()"
      ></image-cropper>
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions class="crop-dialog-actions">
  <div class="actions-rotate">
    <button mat-stroked-button type="button" (click)="rotateLeft()" [disabled]="loadFailed">
      <mat-icon>rotate_left</mat-icon>
      Girar à esquerda
    </button>
    <button mat-stroked-button type="button" (click)="rotateRight()" [disabled]="loadFailed">
      <mat-icon>rotate_right</mat-icon>
      Girar à direita
    </button>
  </div>
  <div class="actions-confirm">
    <button mat-button (click)="cancel()">Cancelar</button>
    <button
      mat-flat-button
      color="primary"
      [disabled]="!croppedBase64 || loadFailed"
      (click)="confirm()"
      >
      <mat-icon>check</mat-icon> Confirmar recorte
    </button>
  </div>
</mat-dialog-actions>
