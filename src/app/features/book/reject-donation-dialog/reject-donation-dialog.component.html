<header class="sharebook-dialog-header">
  <h4 mat-dialog-title>Reprovar doação</h4>
  <button type="button" class="sharebook-dialog-close" aria-label="Fechar" mat-dialog-close>
    <i class="fa fa-times" aria-hidden="true"></i>
  </button>
</header>
<form (ngSubmit)="reject()">
  <mat-dialog-content>
    <p>Tem certeza de que deseja reprovar a doação de <strong>{{ data.bookTitle }}</strong>?</p>
    <p class="text-muted mb-0">A doação será cancelada e a pessoa doadora receberá nossa mensagem padrão sobre direitos autorais.</p>
    @if (lastError) {
      <div class="alert alert-danger mt-3 mb-0" role="alert">{{ lastError }}</div>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-stroked-button type="button" mat-dialog-close [disabled]="isLoading">Voltar</button>
    <button mat-flat-button color="warn" type="submit" [disabled]="isLoading">
      {{ isLoading ? 'Reprovando...' : 'Reprovar e avisar' }}
    </button>
  </mat-dialog-actions>
</form>
